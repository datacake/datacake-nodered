<script type="text/javascript">
  (function () {
    "use strict";

    var NS = "node-red-contrib-datacake/datacake-mqtt:datacake-mqtt.";
    var ANY = "+";
    var COLOR = "#F29D00";

    function t(key, args) {
      return RED._(NS + key, args);
    }

    /** Helpers shared by the configuration node (datacake-configuration.html). */
    function shared() {
      var def = RED.nodes.getType("datacake-configuration");
      return (def && def.datacake) || null;
    }

    function shortId(id) {
      return id && id.length > 8 ? id.slice(0, 8) + "…" : id || "";
    }

    // Same defaults as the runtime (src/lib/settings.ts): properties missing on 0.x nodes keep
    // the old behaviour.
    function inSettings(node) {
      return {
        source: node.source === "product" ? "product" : "device",
        payloadType: node.payloadType === "auto" ? "auto" : "string",
      };
    }

    function outSettings(node) {
      var target =
        node.target === "configured" || node.target === "msg"
          ? node.target
          : node.deviceId
            ? "configured"
            : "msg";
      var fieldMode =
        node.fieldMode === "fixed" || node.fieldMode === "msg" || node.fieldMode === "payload"
          ? node.fieldMode
          : node.fieldName && node.fieldName !== ANY
            ? "fixed"
            : "msg";
      return { target: target, fieldMode: fieldMode };
    }

    // ---- Labels -----------------------------------------------------------------------------

    function liveDevice(node) {
      var helpers = shared();
      return helpers ? helpers.lookupDevice(node.datacakeConfiguration, node.deviceId) : undefined;
    }

    function deviceText(node, info) {
      return (info && info.name) || node.deviceName || shortId(node.deviceId);
    }

    function fieldText(node, info) {
      var field = node.fieldName;
      return (info && info.fields && info.fields[field]) || node.fieldLabel || field;
    }

    function inLabel() {
      if (this.name) {
        return this.name;
      }
      var allFields = !this.fieldName || this.fieldName === ANY;
      if (inSettings(this).source === "product") {
        var product = this.productName || this.productSlug;
        if (!product) {
          return t("label.paletteIn");
        }
        return (
          product +
          " (" +
          t("label.allDevices") +
          ") › " +
          (allFields ? t("label.allFields") : this.fieldLabel || this.fieldName)
        );
      }
      if (!this.deviceId) {
        return t("label.paletteIn");
      }
      var info = liveDevice(this);
      return (
        deviceText(this, info) + " › " + (allFields ? t("label.allFields") : fieldText(this, info))
      );
    }

    function outLabel() {
      if (this.name) {
        return this.name;
      }
      var mode = outSettings(this);
      var info;
      var device;
      if (mode.target === "msg") {
        device = "msg.deviceId";
      } else if (this.deviceId) {
        info = liveDevice(this);
        device = deviceText(this, info);
      } else {
        return t("label.paletteOut");
      }
      var field;
      if (mode.fieldMode === "msg") {
        field = "msg.fieldName";
      } else if (mode.fieldMode === "payload") {
        field = t("label.payloadFields");
      } else {
        field = fieldText(this, info);
      }
      return device + " › " + field;
    }

    function labelStyle() {
      return this.name ? "node_label_italic" : "";
    }

    // ---- Edit dialog ------------------------------------------------------------------------

    function prepareDialog(node, kind) {
      var helpers = shared();
      var $config = $("#node-input-datacakeConfiguration");
      var $message = $("#node-input-datacake-message");
      var $fieldSelect = $("#node-input-datacake-field");
      var $fieldText = $("#node-input-datacake-field-text");
      var $product = $("#node-input-datacake-product");
      var $selected = $("#node-input-datacake-selected");
      var fields = [];
      var products = [];
      var searchRequest = null;

      if (kind === "in") {
        var inMode = inSettings(node);
        $("#node-input-source").val(inMode.source);
        $("#node-input-payloadType").val(inMode.payloadType);
      } else {
        var outMode = outSettings(node);
        $("#node-input-target").val(outMode.target);
        $("#node-input-fieldMode").val(outMode.fieldMode);
        if (outMode.target === "msg" && outMode.fieldMode === "fixed") {
          $fieldText.val(node.fieldName || "");
        }
      }

      function configNode() {
        var id = $config.val();
        return id && id !== "_ADD_" ? RED.nodes.node(id) : null;
      }

      function showMessage(text) {
        $message.text(text || "").toggle(!!text);
      }

      function request(path, data) {
        var cfg = configNode();
        return helpers.api(
          path,
          cfg.id,
          $.extend({ workspaceId: cfg.workspaceId }, data || {}),
        );
      }

      function failed(xhr) {
        showMessage(t("label.loadFailed", { error: helpers.errorText(xhr) }));
      }

      function source() {
        return kind === "in" ? $("#node-input-source").val() : "device";
      }

      function target() {
        return kind === "out" ? $("#node-input-target").val() : "configured";
      }

      function fieldMode() {
        return kind === "out" ? $("#node-input-fieldMode").val() : "fixed";
      }

      // -- Visibility --

      function updateRows() {
        var usesDevice = source() === "device" && target() === "configured";
        $(".datacake-row-device").toggle(usesDevice);
        $(".datacake-row-product").toggle(kind === "in" && source() === "product");
        var fixed = fieldMode() === "fixed";
        $(".datacake-row-field").toggle(fixed && target() === "configured");
        $(".datacake-row-field-text").toggle(fixed && target() === "msg");
        $(".datacake-tip-dynamic").toggle(target() === "msg" || !fixed);
        $(".datacake-tip-payload").toggle(fieldMode() === "payload");
      }

      // -- Fields --

      function renderFields() {
        var current = $("#node-input-fieldName").val();
        $fieldSelect.empty();
        if (kind === "in") {
          $fieldSelect.append($("<option>").val(ANY).text(t("label.allFields")));
          $fieldSelect.append($("<option disabled>").text("──────────"));
        } else {
          $fieldSelect.append($("<option>").val("").text(t("label.selectField")));
        }
        fields.forEach(function (f) {
          var text = f.label && f.label !== f.fieldName ? f.label + " (" + f.fieldName + ")" : f.fieldName;
          $fieldSelect.append($("<option>").val(f.fieldName).text(text));
        });
        var known = fields.some(function (f) {
          return f.fieldName === current;
        });
        if (current && current !== ANY && !known) {
          // Keep the saved field even if it cannot be loaded right now.
          $fieldSelect.append(
            $("<option>").val(current).text($("#node-input-fieldLabel").val() || current),
          );
        }
        $fieldSelect.val(current || (kind === "in" ? ANY : ""));
        $fieldSelect.trigger("change");
      }

      $fieldSelect.on("change", function () {
        var value = $fieldSelect.val() || "";
        if (fieldMode() === "fixed" && target() === "configured") {
          var field = fields.filter(function (f) {
            return f.fieldName === value;
          })[0];
          $("#node-input-fieldName").val(value);
          if (field) {
            $("#node-input-fieldLabel").val(field.label);
          } else if (value === ANY || value === "") {
            $("#node-input-fieldLabel").val("");
          }
        }
      });

      function loadDeviceFields(deviceId) {
        fields = [];
        renderFields();
        if (!deviceId || !configNode()) {
          return;
        }
        request("device", { deviceId: deviceId })
          .done(function (device) {
            if ($("#node-input-deviceId").val() !== deviceId) {
              return;
            }
            fields = device.product.fields || [];
            // Refresh the snapshots, the device may have been renamed in Datacake.
            $("#node-input-deviceName").val(device.name);
            $("#node-input-productSlug").val(device.product.slug);
            $("#node-input-productName").val(device.product.name);
            $selected.text(device.name + " · " + device.product.name);
            helpers.rememberDevice(device.id, {
              name: device.name,
              productName: device.product.name,
              productSlug: device.product.slug,
              fields: fields.reduce(function (map, f) {
                map[f.fieldName] = f.label;
                return map;
              }, {}),
            });
            renderFields();
          })
          .fail(failed);
      }

      // -- Device picker --

      var $list = $("<div>")
        .css({ width: "100%", height: "100%" })
        .appendTo("#node-input-datacake-devices")
        .treeList({ autoSelect: false });

      $list.on("treelistselect", function (e, item) {
        if (!item || !item.device) {
          return;
        }
        var device = item.device;
        var changed = $("#node-input-deviceId").val() !== device.id;
        $("#node-input-deviceId").val(device.id);
        $("#node-input-deviceName").val(device.name);
        $("#node-input-productSlug").val(device.product.slug);
        $("#node-input-productName").val(device.product.name);
        $selected.text(device.name + " · " + device.product.name);
        if (changed) {
          $("#node-input-fieldName").val(kind === "in" ? ANY : "");
          $("#node-input-fieldLabel").val("");
        }
        loadDeviceFields(device.id);
      });

      var $search = $("#node-input-datacake-search").searchBox({
        style: "compact",
        delay: 300,
        change: function () {
          searchDevices($(this).val().trim());
        },
      });

      function searchDevices(text) {
        if (!configNode()) {
          $list.treeList("data", []);
          return;
        }
        if (searchRequest) {
          searchRequest.abort();
        }
        $search.searchBox("count", "");
        var currentId = $("#node-input-deviceId").val();
        searchRequest = request("devices", { search: text })
          .done(function (result) {
            var devices = result.devices || [];
            $list.treeList(
              "data",
              devices.map(function (d) {
                return {
                  label: d.name,
                  sublabel: d.product.name,
                  icon: "fa fa-microchip",
                  device: d,
                  selected: d.id === currentId,
                };
              }),
            );
            if (devices.length === 0) {
              $search.searchBox("count", t("label.noDevicesFound"));
            } else if (result.total > devices.length) {
              $search.searchBox("count", devices.length + " / " + result.total);
            } else {
              $search.searchBox("count", String(devices.length));
            }
          })
          .fail(function (xhr) {
            if (xhr.statusText !== "abort") {
              failed(xhr);
            }
          });
      }

      // -- Products (datacake-in, all devices of a product) --

      function renderProducts() {
        var current = $("#node-input-productSlug").val();
        $product.empty().append($("<option>").val("").text(t("label.selectProduct")));
        products.forEach(function (p) {
          $product.append($("<option>").val(p.slug).text(p.name));
        });
        var known = products.some(function (p) {
          return p.slug === current;
        });
        if (current && !known) {
          $product.append(
            $("<option>").val(current).text($("#node-input-productName").val() || current),
          );
        }
        $product.val(current || "");
      }

      function selectProduct(slug) {
        var product = products.filter(function (p) {
          return p.slug === slug;
        })[0];
        $("#node-input-productSlug").val(slug || "");
        if (product) {
          $("#node-input-productName").val(product.name);
          fields = product.fields || [];
        } else {
          fields = [];
        }
        renderFields();
      }

      $product.on("change", function () {
        var slug = $product.val();
        if (slug !== $("#node-input-productSlug").val()) {
          $("#node-input-fieldName").val(ANY);
          $("#node-input-fieldLabel").val("");
        }
        selectProduct(slug);
      });

      function loadProducts() {
        if (!configNode()) {
          return;
        }
        request("products")
          .done(function (list) {
            products = list || [];
            renderProducts();
            selectProduct($("#node-input-productSlug").val());
          })
          .fail(failed);
      }

      // -- Wiring --

      function reload() {
        showMessage();
        if (!configNode()) {
          showMessage(t("label.selectConfig"));
          $list.treeList("data", []);
          return;
        }
        if (source() === "product") {
          loadProducts();
        } else if (target() === "configured") {
          searchDevices(($search.val() || "").trim());
          loadDeviceFields($("#node-input-deviceId").val());
        }
      }

      var deviceName = $("#node-input-deviceName").val();
      var info = liveDevice(node);
      $selected.text(
        node.deviceId
          ? ((info && info.name) || deviceName || node.deviceId) +
              (node.productName ? " · " + node.productName : "")
          : t("label.noDevice"),
      );

      $config.on("change", reload);
      $("#node-input-source, #node-input-target, #node-input-fieldMode").on("change", function () {
        updateRows();
        reload();
      });
      updateRows();
      renderFields();
      reload();
    }

    function saveDialog(node, kind) {
      if (kind === "in") {
        if ($("#node-input-source").val() === "product") {
          $("#node-input-deviceId").val("");
          $("#node-input-deviceName").val("");
        }
        return;
      }
      var target = $("#node-input-target").val();
      var fieldMode = $("#node-input-fieldMode").val();
      if (target === "msg") {
        $("#node-input-deviceId").val("");
        $("#node-input-deviceName").val("");
        $("#node-input-productSlug").val("");
        $("#node-input-productName").val("");
      }
      if (fieldMode !== "fixed") {
        $("#node-input-fieldName").val("");
        $("#node-input-fieldLabel").val("");
      } else if (target === "msg") {
        $("#node-input-fieldName").val($("#node-input-datacake-field-text").val().trim());
        $("#node-input-fieldLabel").val("");
      }
    }

    var commonDefaults = {
      name: { value: "" },
      datacakeConfiguration: { value: "", type: "datacake-configuration", required: true },
      productSlug: { value: "" },
      deviceId: { value: "" },
      fieldName: { value: "" },
      // Snapshots for the label, refreshed whenever the dialog is saved.
      deviceName: { value: "" },
      fieldLabel: { value: "" },
      productName: { value: "" },
    };

    RED.nodes.registerType("datacake-in", {
      category: "datacake",
      color: COLOR,
      defaults: $.extend({}, commonDefaults, {
        source: { value: "device" },
        payloadType: { value: "auto" },
        fieldName: { value: ANY },
        productSlug: {
          value: "",
          validate: function (v) {
            return !!v;
          },
        },
        deviceId: {
          value: "",
          validate: function (v) {
            return inSettings(this).source === "product" || !!v;
          },
        },
      }),
      inputs: 0,
      outputs: 1,
      icon: "datacake.svg",
      paletteLabel: function () {
        return t("label.paletteIn");
      },
      label: inLabel,
      labelStyle: labelStyle,
      outputLabels: function () {
        return inLabel.call(this);
      },
      oneditprepare: function () {
        prepareDialog(this, "in");
      },
      oneditsave: function () {
        saveDialog(this, "in");
      },
    });

    RED.nodes.registerType("datacake-out", {
      category: "datacake",
      color: COLOR,
      align: "right",
      defaults: $.extend({}, commonDefaults, {
        target: { value: "configured" },
        fieldMode: { value: "fixed" },
        deviceId: {
          value: "",
          validate: function (v) {
            return outSettings(this).target === "msg" || !!v;
          },
        },
        fieldName: {
          value: "",
          validate: function (v) {
            return outSettings(this).fieldMode !== "fixed" || (!!v && v !== ANY);
          },
        },
      }),
      inputs: 1,
      outputs: 0,
      icon: "datacake.svg",
      paletteLabel: function () {
        return t("label.paletteOut");
      },
      label: outLabel,
      labelStyle: labelStyle,
      inputLabels: function () {
        return outLabel.call(this);
      },
      oneditprepare: function () {
        prepareDialog(this, "out");
      },
      oneditsave: function () {
        saveDialog(this, "out");
      },
    });
  })();
</script>

<script type="text/html" data-template-name="datacake-in">
  <div class="form-row">
    <label for="node-input-datacakeConfiguration"
      ><i class="fa fa-user"></i> <span data-i18n="datacake-mqtt.label.configuration"></span
    ></label>
    <input type="text" id="node-input-datacakeConfiguration" />
  </div>
  <div class="form-row">
    <label for="node-input-source"
      ><i class="fa fa-sitemap"></i> <span data-i18n="datacake-mqtt.label.source"></span
    ></label>
    <select id="node-input-source" style="width: 70%">
      <option value="device" data-i18n="datacake-mqtt.label.sourceDevice"></option>
      <option value="product" data-i18n="datacake-mqtt.label.sourceProduct"></option>
    </select>
  </div>
  <div class="form-row datacake-row-device">
    <label><i class="fa fa-microchip"></i> <span data-i18n="datacake-mqtt.label.device"></span></label>
    <span id="node-input-datacake-selected" style="font-weight: bold"></span>
  </div>
  <div class="form-row datacake-row-device">
    <div style="display: inline-block; width: 100%; text-align: right">
      <input
        type="text"
        id="node-input-datacake-search"
        data-i18n="[placeholder]datacake-mqtt.label.searchDevices"
      />
    </div>
    <div
      id="node-input-datacake-devices"
      style="height: 180px; margin-top: 4px; border: 1px solid var(--red-ui-secondary-border-color, #ccc)"
    ></div>
  </div>
  <div class="form-row datacake-row-product">
    <label for="node-input-datacake-product"
      ><i class="fa fa-cube"></i> <span data-i18n="datacake-mqtt.label.product"></span
    ></label>
    <select id="node-input-datacake-product" style="width: 70%"></select>
  </div>
  <div class="form-row datacake-row-field">
    <label for="node-input-datacake-field"
      ><i class="fa fa-tag"></i> <span data-i18n="datacake-mqtt.label.field"></span
    ></label>
    <select id="node-input-datacake-field" style="width: 70%"></select>
  </div>
  <div class="form-row">
    <label for="node-input-payloadType"
      ><i class="fa fa-sign-out"></i> <span data-i18n="datacake-mqtt.label.payloadType"></span
    ></label>
    <select id="node-input-payloadType" style="width: 70%">
      <option value="auto" data-i18n="datacake-mqtt.label.payloadAuto"></option>
      <option value="string" data-i18n="datacake-mqtt.label.payloadString"></option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-name"
      ><i class="fa fa-tag"></i> <span data-i18n="datacake-mqtt.label.name"></span
    ></label>
    <input type="text" id="node-input-name" data-i18n="[placeholder]datacake-mqtt.label.name" />
  </div>
  <div class="form-tips" id="node-input-datacake-message" style="display: none"></div>
  <div class="form-tips"><span data-i18n="[html]datacake-mqtt.tip.inMessage"></span></div>
  <input type="hidden" id="node-input-deviceId" />
  <input type="hidden" id="node-input-productSlug" />
  <input type="hidden" id="node-input-fieldName" />
  <input type="hidden" id="node-input-deviceName" />
  <input type="hidden" id="node-input-productName" />
  <input type="hidden" id="node-input-fieldLabel" />
</script>

<script type="text/html" data-template-name="datacake-out">
  <div class="form-row">
    <label for="node-input-datacakeConfiguration"
      ><i class="fa fa-user"></i> <span data-i18n="datacake-mqtt.label.configuration"></span
    ></label>
    <input type="text" id="node-input-datacakeConfiguration" />
  </div>
  <div class="form-row">
    <label for="node-input-target"
      ><i class="fa fa-crosshairs"></i> <span data-i18n="datacake-mqtt.label.target"></span
    ></label>
    <select id="node-input-target" style="width: 70%">
      <option value="configured" data-i18n="datacake-mqtt.label.targetConfigured"></option>
      <option value="msg" data-i18n="datacake-mqtt.label.targetMsg"></option>
    </select>
  </div>
  <div class="form-row datacake-row-device">
    <label><i class="fa fa-microchip"></i> <span data-i18n="datacake-mqtt.label.device"></span></label>
    <span id="node-input-datacake-selected" style="font-weight: bold"></span>
  </div>
  <div class="form-row datacake-row-device">
    <div style="display: inline-block; width: 100%; text-align: right">
      <input
        type="text"
        id="node-input-datacake-search"
        data-i18n="[placeholder]datacake-mqtt.label.searchDevices"
      />
    </div>
    <div
      id="node-input-datacake-devices"
      style="height: 180px; margin-top: 4px; border: 1px solid var(--red-ui-secondary-border-color, #ccc)"
    ></div>
  </div>
  <div class="form-row">
    <label for="node-input-fieldMode"
      ><i class="fa fa-list"></i> <span data-i18n="datacake-mqtt.label.fieldMode"></span
    ></label>
    <select id="node-input-fieldMode" style="width: 70%">
      <option value="fixed" data-i18n="datacake-mqtt.label.fieldFixed"></option>
      <option value="msg" data-i18n="datacake-mqtt.label.fieldMsg"></option>
      <option value="payload" data-i18n="datacake-mqtt.label.fieldPayload"></option>
    </select>
  </div>
  <div class="form-row datacake-row-field">
    <label for="node-input-datacake-field"
      ><i class="fa fa-tag"></i> <span data-i18n="datacake-mqtt.label.field"></span
    ></label>
    <select id="node-input-datacake-field" style="width: 70%"></select>
  </div>
  <div class="form-row datacake-row-field-text">
    <label for="node-input-datacake-field-text"
      ><i class="fa fa-tag"></i> <span data-i18n="datacake-mqtt.label.fieldIdentifier"></span
    ></label>
    <input type="text" id="node-input-datacake-field-text" placeholder="TEMPERATURE" style="width: 70%" />
  </div>
  <div class="form-row">
    <label for="node-input-name"
      ><i class="fa fa-tag"></i> <span data-i18n="datacake-mqtt.label.name"></span
    ></label>
    <input type="text" id="node-input-name" data-i18n="[placeholder]datacake-mqtt.label.name" />
  </div>
  <div class="form-tips" id="node-input-datacake-message" style="display: none"></div>
  <div class="form-tips datacake-tip-payload" style="margin-bottom: 8px">
    <span data-i18n="[html]datacake-mqtt.tip.outPayload"></span>
  </div>
  <div class="form-tips datacake-tip-dynamic">
    <span data-i18n="datacake-mqtt.tip.outDynamic"></span>
  </div>
  <input type="hidden" id="node-input-deviceId" />
  <input type="hidden" id="node-input-productSlug" />
  <input type="hidden" id="node-input-fieldName" />
  <input type="hidden" id="node-input-deviceName" />
  <input type="hidden" id="node-input-productName" />
  <input type="hidden" id="node-input-fieldLabel" />
</script>
