name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 18, node-red: "3.1" }
          - { node: 20, node-red: "3.1" }
          - { node: 20, node-red: "4.1" }
          - { node: 22, node-red: "5" }
          - { node: 24, node-red: "5" }
    name: test (Node.js ${{ matrix.node }}, Node-RED ${{ matrix.node-red }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save node-red@${{ matrix.node-red }}
      - run: npm test
